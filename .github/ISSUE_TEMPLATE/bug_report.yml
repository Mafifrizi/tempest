name: Bug Report
description: Report a bug in Souei, Chronoa, Ranga, or libranga.so
title: "fix: [short description of the issue]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Provide exact command arguments, kernel/OS version, and exit codes below.

  - type: dropdown
    id: operative
    attributes:
      label: Affected Operative
      options:
        - Souei (keyring, KCM SO_PEERCRED, inotify)
        - Chronoa (CCACHE v3/v4 TTL, ciphers, clock skew)
        - Ranga (keyring isolation & NIST SP 800-88 purge)
        - libranga.so (LD_PRELOAD keyring jail)
        - Build / Test Suite
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System and Kernel
      placeholder: "Ubuntu 24.04 x86_64, Linux 6.8, GCC 13"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Executed
      placeholder: "./bin/chronoa --ccache /tmp/krb5cc_1000 --json"
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior and Error Output
      description: Include JSON output, stderr logs, and exit code (0..4).
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation Checklist
      options:
        - label: I verified that no live Kerberos ticket caches, keytabs, or private credentials are included in this report.
          required: true
        - label: I checked existing issues to make sure this is not a duplicate.
          required: true
